name: Deploy VIVER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: viver-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out VIVER
        uses: actions/checkout@v4

      - name: Validate site files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s features.js
          test -s connections.js
          test -s youtube.js
          test -s overview-analytics.js
          test -s creator-studio.js
          test -s style.css
          test -s favicon.svg
          node --check app.js
          node --check features.js
          node --check connections.js
          node --check youtube.js
          node --check overview-analytics.js
          node --check creator-studio.js
          grep -q 'src="./app.js' index.html
          grep -q 'href="./style.css' index.html

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html app.js features.js connections.js youtube.js overview-analytics.js creator-studio.js style.css favicon.svg _site/
          touch _site/.nojekyll
          printf '%s\n' 'VIVER static site prepared.'

      # First enable Settings > Pages > Build and deployment > Source: GitHub Actions.
      # The GITHUB_TOKEN cannot create a Pages site for an unconfigured repository.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
