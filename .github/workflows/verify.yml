name: Verify VIVER interactions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'features.js'
      - 'connections.js'
      - 'youtube.js'
      - 'overview-analytics.js'
      - 'creator-studio.js'
      - 'platform-hub.js'
      - 'auth-worker/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

concurrency:
  group: viver-verification-v2
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout VIVER
        uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check features.js
          node --check connections.js
          node --check youtube.js
          node --check overview-analytics.js
          node --check creator-studio.js
          node --check platform-hub.js
          node --check tests/platform-hub.cjs
          node --check tests/youtube-channels.cjs
          node --check auth-worker/src/index.js
          node --check tests/oauth.cjs
          node --check tests/smoke.cjs
          node --check tests/studio.cjs
      - name: Install test dependency
        run: npm install --no-save --no-package-lock --prefer-offline jsdom@26
      - name: Run interactive DOM tests
        run: node tests/smoke.cjs
      - name: Run OAuth backend tests
        run: node tests/oauth.cjs
      - name: Test Creator Studio interface
        run: node tests/studio.cjs
      - name: Test connected-only platform tabs
        run: node tests/platform-hub.cjs
      - name: Test multi-channel YouTube switcher
        run: node tests/youtube-channels.cjs
